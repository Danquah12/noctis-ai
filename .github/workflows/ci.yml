name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/noctis-general-baseline.test.mjs scripts/noctis-compare-baselines.test.mjs
      - run: npm run build
        env:
          VITE_AUTH_ENABLED: "true"
